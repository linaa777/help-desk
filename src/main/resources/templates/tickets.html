<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список заявок | Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Список заявок</h1>
    <a href="/" class="btn btn-secondary mb-3">← На главную</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Тема</th>
            <th>Описание</th>
            <th>Статус</th>
            <th>Клиент</th>
            <th>Дата создания</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.id}">1</td>
            <td th:text="${ticket.title}">Тема</td>
            <td th:text="${ticket.description}">Описание</td>
            <td th:text="${ticket.status}">OPEN</td>
            <td th:text="${ticket.customerName}">Клиент</td>
            <td th:text="${ticket.createdAt}">2025-01-01</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
